[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-plus"                 # любое имя дистрибутива на PyPI/locally
version = "0.0.0"
description = "CLI OSINT tool"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "you" }]
license = { text = "MIT" }

# Консольная команда, которую будет создавать pip.
# Можешь оставить `osintmagic-plus`, если так привычнее.
[project.scripts]
osint-plus = "osint.cli:main"       # ← CLI-функция main() в osint/cli.py
# osintmagic-plus = "osint.cli:main"  # ← альтернативное имя команды, если нужно

[tool.setuptools]
package-dir = { "" = "." }          # плоская раскладка (без src/)

[tool.setuptools.packages.find]
include = ["osint", "osint.*"]      # ищем ТОЛЬКО пакет osint
exclude = [
  "tests*",
  "reports*",
  "logs*",
  "cache*",
  "sources*",
  "build*",
  "dist*",
  "venv*",
  ".venv*",
]

[tool.setuptools.package-data]
# Если в osint/ лежат шаблоны/статические файлы — добавь их:
osint = [
  "templates/*.html",
  "static/css/*",
  "static/js/*",
  "report_assets/*",
  "sources.json"
]
